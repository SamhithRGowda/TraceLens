[project]
name = "tracelens"
version = "0.1.0"
description = "Lightweight evidence-capture SDK for TraceLens"
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracelens*"]
